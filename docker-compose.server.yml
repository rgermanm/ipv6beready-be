# Copy this file to the VPS as /home/deploy/ipv6beready/docker-compose.yml
# Keep in sync with ipv6beready-fe/docker-compose.server.yml
#
# Expected images:
#   ghcr.io/rgermanm/ipv6beready-fe:stage|production
#   ghcr.io/rgermanm/ipv6beready-be:stage|production
#
# Backend secrets live in /home/deploy/ipv6beready/.env.stage and .env.prod

services:
  ipv6-front-stage:
    image: ghcr.io/rgermanm/ipv6beready-fe:stage
    restart: unless-stopped
    ports:
      - "3001:3000"

  ipv6-back-stage:
    image: ghcr.io/rgermanm/ipv6beready-be:stage
    restart: unless-stopped
    env_file:
      - .env.stage
    ports:
      - "8001:8000"

  ipv6-front-prod:
    image: ghcr.io/rgermanm/ipv6beready-fe:production
    restart: unless-stopped
    ports:
      - "3000:3000"

  ipv6-back-prod:
    image: ghcr.io/rgermanm/ipv6beready-be:production
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
